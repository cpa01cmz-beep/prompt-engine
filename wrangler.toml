[[kv_namespaces]]
binding = "CACHE"
id = "26ee6d1bfc1241e69705b8df069ec16d"

[vars]
OPENAI_BASE_URL = "https://opencode.ai/zen/v1"
OPENAI_MODEL = "deepseek-v4.1-flash-free"
